spring.application.name=crud-asistencia

# Conexion a PostgreSQL en Docker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/asistencia_db}
spring.datasource.username=asistencia_admin
spring.datasource.password=${DB_PASSWORD}

# Controlador JDBC
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de MyBatis
mybatis.configuration.map-underscore-to-camel-case=true

# Puerto de Spring Boot
server.port=8080